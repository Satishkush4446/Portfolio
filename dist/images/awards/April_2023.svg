<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sealGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="url(#goldBorder2)" stroke-width="2" opacity="0.85"/>
  <!-- Inner Delicate Border -->
  <rect x="28" y="28" width="744" height="504" rx="8" fill="none" stroke="#333338" stroke-width="1"/>
  
  <!-- Corner Ornaments -->
  <path d="M 38 52 L 52 38 M 38 64 L 64 38" stroke="url(#goldBorder2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 762 52 L 748 38 M 762 64 L 736 38" stroke="url(#goldBorder2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 38 508 L 52 522 M 38 496 L 64 522" stroke="url(#goldBorder2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 762 508 L 748 522 M 762 496 L 736 522" stroke="url(#goldBorder2)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Company Header -->
  <text x="400" y="85" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#999999">
    ADAAN DIGITAL SOLUTIONS
  </text>
  <text x="400" y="108" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#666666">
    PROFESSIONAL RECOGNITION &amp; OUTSTANDING PERFORMANCE
  </text>

  <!-- Title -->
  <text x="400" y="175" text-anchor="middle" font-family="'Syne', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#F5F5F5">
    STAR OF THE MONTH
  </text>
  <line x1="300" y1="195" x2="500" y2="195" stroke="url(#goldBorder2)" stroke-width="2"/>

  <!-- Recipient presentation -->
  <text x="400" y="240" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="1" fill="#A1A1AA">
    THIS PROUDLY CERTIFIES THAT
  </text>
  <text x="400" y="290" text-anchor="middle" font-family="'Syne', -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#FBBF24" filter="url(#glow2)">
    SATISH KUSHWAHA
  </text>
  <text x="400" y="325" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    has been awarded Star of the Month for exceptional delivery in website development,
  </text>
  <text x="400" y="348" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    platform migrations, and design customization across Duda, Wix, and WordPress.
  </text>

  <!-- Golden Seal Graphic -->
  <g transform="translate(400, 435)">
    <circle r="36" fill="url(#sealGrad2)" opacity="0.15"/>
    <circle r="30" fill="none" stroke="url(#goldBorder2)" stroke-width="2" stroke-dasharray="3 3"/>
    <circle r="24" fill="#0A0A0C" stroke="url(#goldBorder2)" stroke-width="1.5"/>
    <text y="4" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#FBBF24" letter-spacing="1">
      ★ 2023 ★
    </text>
  </g>

  <!-- Issuer Signatures / Metadata -->
  <!-- Left: Issued By -->
  <line x1="120" y1="475" x2="280" y2="475" stroke="#44444A" stroke-width="1"/>
  <text x="200" y="495" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F5F5F5">
    Puja Khurana
  </text>
  <text x="200" y="512" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#71717A">
    Issued By • Adaan Digital Solutions
  </text>

  <!-- Right: Date -->
  <line x1="520" y1="475" x2="680" y2="475" stroke="#44444A" stroke-width="1"/>
  <text x="600" y="495" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#FBBF24">
    April 2023
  </text>
  <text x="600" y="512" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#71717A">
    Date of Conferment
  </text>
</svg>
